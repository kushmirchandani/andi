# fly launch --no-deploy --copy-config   (pick a unique app name, then update PUBLIC_URL)
# fly volumes create andi_data --size 1 --region bos
# fly secrets set PHOTON_API_KEY=... PHOTON_PROJECT_ID=... ANTHROPIC_API_KEY=... (see .env.example)
# fly deploy

app = "andi-backend"
primary_region = "bos"
# Give the server a moment to flush its store on deploy.
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  APP_TIMEZONE = "America/New_York"
  PUBLIC_URL = "https://andi-backend.fly.dev"

[mounts]
  source = "andi_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Andi holds Photon's event stream and the chip's WebSocket open, so keep one machine always on.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
