# fly.toml app configuration file generated for andi-tdc-backend on 2026-10-17T19:15:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'andi-tdc-backend'
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]

[env]
  APP_TIMEZONE = 'America/New_York'
  DATA_DIR = '/data'
  PORT = '8080'
  PUBLIC_URL = 'https://andi-tdc-backend.fly.dev'

[[mounts]]
  source = 'andi_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
